# What the link check covers, and what it cannot fetch.
#
# The scope is the reader-facing front matter: `README.md` today, and `docs/`
# from the day the first page lands there. It is those deliberately, not every
# Markdown file this repository holds — `vendor/` is a copy of another
# repository's tree, so a link that only exists there belongs to the repository
# that writes it.
# `scripts/ci-local.sh links` and the `checks` job of `.github/workflows/ci.yml`
# pass this file and the same argument, so the checker reads here what the
# runner reads.
#
# `exclude` holds the addresses the check cannot fetch, each with its reason.
# It was built from a real run over that argument: every relative link in it
# lands on a file that is here, and the specification repository the README
# points at resolves. The README prints no loopback address and no address of
# its own to write to, so there is neither kind to exclude. A URL that needs an
# entry gets one here with its reason beside it, and a link that answers nowhere
# is a link to fix rather than one to exclude.
exclude = [
  # The README prints no address to write to, so nothing in scope is a
  # `mailto:` today. It is named anyway: the check runs without
  # `--include-mail`, so a `mailto:` is counted as excluded whether or not it
  # is named, and naming it keeps that a stated choice for the day the README
  # carries a contact address, which is also the day it stops being a link the
  # check could follow to a live destination.
  "^mailto:",
]
