name: ci

# No `push: branches: [main]`: a pull request already runs the whole job, and the
# merge commit carries the same content, so the merge would run it a second time.
# `workflow_dispatch` is the re-run for a commit that reached `main` without one.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The lychee release the nixpkgs of the day carries, so a developer and the runner check
      # links with the same binary. The checksum is the one published beside the archive.
      LYCHEE_VERSION: "0.24.2"
      LYCHEE_SHA256: "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"
          cache: npm

      - run: npm ci

      # The artifact `bin` names, built by the script `prepare` runs. A broken build is red here,
      # on its own line, rather than inside the suite that packs and installs it.
      - run: npm run build

      - run: npm run typecheck

      # The suite the server's own processes can run. The two-process proof — two MCP servers
      # over their stdio, editing one room on a real `selvaged` — is the pair of steps below this
      # one. `test/packed.test.ts` packs this repository, installs the tarball outside it and
      # drives the installed command, which needs npm and no network beyond what `npm ci` already
      # did. The flake's checks — and the `pre-commit` hook set it installs — need Nix, which this
      # job does not set up; `scripts/ci-local.sh checks` runs those on a machine that has it.
      - run: npm test

      # The two-process proof, which needs a real `selvaged` and no sibling `reference_server`
      # checkout to build one from. It takes the published one instead: the image is a static
      # binary on `scratch`, so `scripts/fetch-selvaged.sh` reads it off the registry anonymously
      # in about a second, with no `docker`, no Rust toolchain and no cache between the proof and
      # the bytes. The script pins the release commit, checks each layer against the digest its
      # manifest carries, and refuses a binary that does not print the version its tag names — so
      # a fetch that cannot happen is a red step named here, never a proof that did not run.
      # `$RUNNER_TEMP` is the runner's own scratch directory, not this host's RAM-backed `/tmp`.
      - name: fetch the published selvaged
        run: scripts/fetch-selvaged.sh "$RUNNER_TEMP/selvaged"

      # The same command `scripts/ci-local.sh e2e` runs, with the fetched binary named the way
      # `test/helpers/selvaged.ts` looks for one. `SELVAGE_SELVAGED` is on this step alone, so
      # nothing above is proved against a server that is not there yet.
      - name: the two-process proof
        env:
          SELVAGE_SELVAGED: ${{ runner.temp }}/selvaged/selvaged
        run: npm run test:e2e

      # The runner has no nix, so the pinned lychee release is installed here and the link check
      # takes it from PATH.
      - name: install lychee
        run: |
          curl -fsSL -o "$RUNNER_TEMP/lychee.tar.gz" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          echo "${LYCHEE_SHA256}  $RUNNER_TEMP/lychee.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/lychee.tar.gz" -C "$RUNNER_TEMP" --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          sudo install -m 0755 "$RUNNER_TEMP/lychee" /usr/local/bin/lychee
          lychee --version

      # Every relative link in the reader-facing prose, and every URL it carries. The scope is
      # `README.md` rather than every Markdown file this repository holds, and `docs/` joins it
      # with its first page; `lychee.toml` says why.
      - name: links over the README
        run: lychee --config lychee.toml --no-progress README.md
